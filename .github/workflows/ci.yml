name: CI

on:
  push:
    branches: [main, master, 'arena/**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Job 1: unit + integration tests ────────────────────────
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    # Node 18 is EOL (Apr 2025) and ESLint 9 requires >=18.18, so the
    # engines floor is 20.9. engine-strict=true turns an unsupported version
    # into a hard `npm ci` failure, so the matrix floor and engines.node must
    # stay in sync — tests/config.test.js asserts exactly that.
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required files exist
        run: |
          set -euo pipefail
          for f in server.js package.json package-lock.json .env.example .gitignore \
                   .dockerignore Dockerfile eslint.config.js README.md \
                   public/index.html public/style.css public/app.js; do
            [ -f "$f" ] || { echo "MISSING: $f"; exit 1; }
            echo "  ✓ $f"
          done

      - name: Validate env template
        run: |
          set -euo pipefail
          count=$(grep -cvE '^\s*(#|$)' .env.example)
          [ "$count" -ge 4 ] || { echo "ERROR: .env.example is incomplete"; exit 1; }
          for key in OPENAI_API_KEY OPENAI_BASE_URL OPENAI_MODEL PORT HOST; do
            grep -q "^${key}=" .env.example || { echo "ERROR: $key missing from .env.example"; exit 1; }
          done
          echo "✓ .env.example documents $count settings"

      - name: Syntax check
        run: |
          node --check server.js
          node --check public/app.js
          echo "✓ syntax OK"

      # Unit tests assert on source text; integration tests boot the real
      # server against a stub upstream on localhost (no network, no API key).
      - name: Run tests
        run: npm test

  # ── Job 2: lint ────────────────────────────────────────────
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on any error and on warning growth past the cap in the
      # `lint` script. Previously this step ended in `|| true` and used a
      # config ESLint 9 ignores, so it could never fail.
      - name: Run ESLint
        run: npm run lint

  # ── Job 3: production install path ─────────────────────────
  prod-install:
    name: Production install (npm ci --omit=dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install production dependencies only
        run: npm ci --omit=dev

      - name: Dev tooling must be absent
        run: |
          set -euo pipefail
          [ ! -d node_modules/eslint ] || { echo "ERROR: devDependencies leaked into a prod install"; exit 1; }
          echo "✓ dev tooling excluded"

      # Catches a runtime dependency accidentally listed under devDependencies:
      # the app must be require-able with production deps alone.
      - name: App loads with production dependencies only
        run: |
          set -euo pipefail
          node -e "
            const { app, createApp } = require('./server.js');
            if (!app || typeof createApp !== 'function') { console.error('server.js did not export the app'); process.exit(1); }
            console.log('✓ server.js loads without dev dependencies');
          "

  # ── Job 4: Docker image build + container smoke test ───────
  docker:
    name: Docker (build + smoke test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: aaron-ai-chat:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs as a non-root user
        run: |
          set -euo pipefail
          uid=$(docker run --rm aaron-ai-chat:ci id -u)
          [ "$uid" != "0" ] || { echo "ERROR: container runs as root"; exit 1; }
          echo "✓ running as uid $uid"

      - name: No secrets or dev tooling baked into the image
        run: |
          set -euo pipefail
          docker run --rm aaron-ai-chat:ci sh -c '
            for bad in /app/.env /app/tests /app/.git /app/eslint.config.js; do
              if [ -e "$bad" ]; then echo "LEAKED INTO IMAGE: $bad"; exit 1; fi
            done
            echo "✓ image contains no secrets or test tooling"
          '

      # Criterion: the image must boot and report health WITHOUT credentials,
      # so a smoke test needs no secrets and a misconfigured deploy is
      # diagnosable rather than crash-looping.
      - name: Start container with NO credentials
        run: |
          docker run -d --name chat-noauth -p 3000:3000 \
            -e OPENAI_MODEL=ci-model \
            aaron-ai-chat:ci

      - name: Wait for the built-in HEALTHCHECK to report healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' chat-noauth)
            echo "  health: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$status" = "unhealthy" ]; then docker logs chat-noauth; exit 1; fi
            sleep 2
          done
          echo "ERROR: container never became healthy"
          docker logs chat-noauth
          exit 1

      - name: Unconfigured container is live but not ready
        run: |
          set -euo pipefail

          health=$(curl -fsS http://127.0.0.1:3000/api/health)
          echo "  /api/health -> $health"
          echo "$health" | grep -q '"ok":true'
          echo "$health" | grep -q '"model":"ci-model"'
          echo "$health" | grep -q '"configured":false'

          ready=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/ready)
          [ "$ready" = "503" ] || { echo "ERROR: /api/ready should be 503 without a key, got $ready"; exit 1; }
          echo "  /api/ready -> $ready (correctly not ready)"

          chat=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/chat \
            -H 'Content-Type: application/json' --data '{"messages":[{"role":"user","content":"hi"}]}')
          [ "$chat" = "503" ] || { echo "ERROR: /api/chat should be 503 without a key, got $chat"; exit 1; }
          echo "  /api/chat -> $chat (refuses to serve)"

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)
          [ "$code" = "200" ] || { echo "ERROR: frontend not served (HTTP $code)"; exit 1; }
          echo "  / -> $code"

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/nope)
          [ "$code" = "404" ] || { echo "ERROR: expected 404, got $code"; exit 1; }
          echo "  /api/nope -> $code"

          docker rm -f chat-noauth >/dev/null

      - name: Start container WITH a dummy key
        run: |
          docker run -d --name chat-smoke -p 3000:3000 \
            -e OPENAI_API_KEY=sk-ci-smoke-key \
            -e OPENAI_MODEL=ci-model \
            aaron-ai-chat:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done

      - name: Configured container is ready and streams SSE
        run: |
          set -euo pipefail

          ready=$(curl -fsS http://127.0.0.1:3000/api/ready)
          echo "  /api/ready -> $ready"
          echo "$ready" | grep -q '"ready":true'

          # SSE headers must survive the container boundary, and an invalid
          # payload must produce an error event rather than hanging.
          headers=$(curl -sS -D - -o /tmp/sse.txt -X POST http://127.0.0.1:3000/api/chat \
            -H 'Content-Type: application/json' --data '{"messages":[]}' --max-time 10)
          echo "$headers" | grep -qi 'content-type: text/event-stream'
          echo "$headers" | grep -qi 'x-accel-buffering: no'
          grep -q 'event: error' /tmp/sse.txt
          echo "✓ SSE headers and error event verified through the container"

      - name: Stops cleanly on SIGTERM (exit code 0)
        run: |
          set -euo pipefail
          docker stop -t 15 chat-smoke >/dev/null
          code=$(docker inspect -f '{{.State.ExitCode}}' chat-smoke)
          docker logs chat-smoke 2>&1 | tail -5
          [ "$code" = "0" ] || { echo "ERROR: unclean shutdown, exit code $code"; exit 1; }
          echo "✓ graceful shutdown (exit 0)"

      - name: Report image size
        if: always()
        run: docker image ls aaron-ai-chat:ci --format '  {{.Repository}}:{{.Tag}}  {{.Size}}'

      - name: Clean up
        if: always()
        run: docker rm -f chat-smoke chat-noauth 2>/dev/null || true

  # ── Job 5: security ────────────────────────────────────────
  security:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Secrets are ignored by git and Docker
        run: |
          set -euo pipefail
          grep -qx '\.env' .gitignore     || { echo "ERROR: .env not in .gitignore"; exit 1; }
          grep -qx '\.env' .dockerignore  || { echo "ERROR: .env not in .dockerignore"; exit 1; }
          echo "✓ .env excluded from git and from the build context"

      - name: No server-only env vars referenced in public/
        run: |
          if grep -rE 'OPENAI_API_KEY|process\.env\.OPENAI' public/ 2>/dev/null; then
            echo "ERROR: server-side env referenced in public/"
            exit 1
          fi
          echo "✓ no server-only env vars in public/"

      - name: No hardcoded credentials
        run: |
          set -euo pipefail
          if grep -rE 'sk-[a-zA-Z0-9]{20,}' . --include='*.js' --include='*.html' \
               --include='*.css' --exclude-dir=node_modules 2>/dev/null; then
            echo "ERROR: possible hardcoded API key above"
            exit 1
          fi
          echo "✓ no hardcoded credentials"
