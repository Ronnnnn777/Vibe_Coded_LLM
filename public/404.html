<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 — Aaron AI Chat</title>
  <!--
    Styles are inline on purpose: this page is served straight from the CDN
    with no function invocation, and it should still render correctly if
    style.css is missing or failed to deploy.
  -->
  <style>
    :root {
      --bg: #0f1116;
      --bg-raised: #171a21;
      --border: #2a2f3a;
      --text: #e6e9f0;
      --text-dim: #9aa1b2;
      --accent: #7c7cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    main {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 40px 44px;
      max-width: 440px;
      text-align: center;
    }
    .code {
      font-size: 56px;
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
      margin: 0 0 12px;
    }
    h1 { font-size: 19px; margin: 0 0 10px; font-weight: 600; }
    p { color: var(--text-dim); font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
    a {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    a:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>That URL doesn&rsquo;t exist. The chat lives at the home page.</p>
    <a href="/">Back to chat</a>
  </main>
</body>
</html>
